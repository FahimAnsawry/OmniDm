[package]
name = "omnidm-setup"
description = "OmniDM-Setup.exe: the setup window around OmniDM's installer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[features]
# Serves the built UI from inside the program instead of the development server.
custom-protocol = ["tauri/custom-protocol"]
