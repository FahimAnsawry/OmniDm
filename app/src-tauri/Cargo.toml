[package]
name = "omnidm-app"
description = "OmniDm desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids https://github.com/rust-lang/cargo/issues/8519 on Windows.
name = "omnidm_app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omnidm-core = { version = "0.1.0", path = "../../crates/omnidm-core" }
omnidm-ipc = { version = "0.1.0", path = "../../crates/omnidm-ipc" }
omnidm-queue = { version = "0.1.0", path = "../../crates/omnidm-queue" }
omnidm-service = { version = "0.1.0", path = "../../crates/omnidm-service" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }

[features]
# Serves the built UI from inside the program instead of the development server.
# `tauri build` turns it on; for a plain `cargo build`, pass `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
