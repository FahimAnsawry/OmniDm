name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The Tauri crate embeds app/dist at compile time, so build the UI first.
      - name: Build app UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Crash test (20 random kills of a 128 MiB download)
        run: cargo test -p omnidm-cli --test crash -- --ignored --nocapture

  extension:
    name: Extension (type-check, build)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm run build
      - run: npm run build:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: omnidm-extension
          path: extension/.output/*-mv3/
