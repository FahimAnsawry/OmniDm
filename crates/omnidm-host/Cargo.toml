[package]
name = "omnidm-host"
description = "Native messaging host that connects the OmniDM browser extension to the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omnidm-ipc = { version = "0.1.0", path = "../omnidm-ipc" }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "io-std", "io-util", "net", "time", "macros", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading"] }

[dev-dependencies]
fastrand = "2.5.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
