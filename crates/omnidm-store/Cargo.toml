[package]
name = "omnidm-store"
description = "SQLite storage: schema, migrations, downloads, segments and settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omnidm-core = { version = "0.1.0", path = "../omnidm-core" }
omnidm-queue = { version = "0.1.0", path = "../omnidm-queue" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }
jiff = "0.2.38"
tempfile = "3.27.0"
