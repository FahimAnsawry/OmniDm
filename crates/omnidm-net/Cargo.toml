[package]
name = "omnidm-net"
description = "HTTP client layer: proxies and PAC, authentication, cookies, redirects, file naming."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cookie_store = { version = "0.22.1", default-features = false }
httpdate = "1.0.3"
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[dev-dependencies]
omnidm-testserver = { path = "../omnidm-testserver" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
