[package]
name = "omnidm-testserver"
description = "HTTP test server with fault injection, used by OmniDm integration tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
bytes = "1.12.1"
futures-util = "0.3.34"
httpdate = "1.0.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
