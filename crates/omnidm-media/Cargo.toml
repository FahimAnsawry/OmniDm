[package]
name = "omnidm-media"
description = "HLS and DASH parsing, AES-128 decryption and the FFmpeg remux adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.9.3"
cbc = "0.2.1"
dash-mpd-core = { version = "0.1.0", default-features = false, features = ["log"] }
m3u8-rs = "6.0.1"
url = "2.5.8"

[dev-dependencies]
cbc = { version = "0.2.1", features = ["alloc"] }
