[package]
name = "omnidm-cli"
description = "Command-line client for OmniDm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "omnidm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
base64 = "0.22"
omnidm-core = { version = "0.1.0", path = "../omnidm-core" }
omnidm-ipc = { version = "0.1.0", path = "../omnidm-ipc" }
omnidm-net = { version = "0.1.0", path = "../omnidm-net" }
omnidm-service = { version = "0.1.0", path = "../omnidm-service" }
omnidm-store = { version = "0.1.0", path = "../omnidm-store" }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "io-util"] }
tokio-util = "0.7.20"

[dev-dependencies]
fastrand = "2.5.0"
omnidm-service = { path = "../omnidm-service" }
omnidm-testserver = { path = "../omnidm-testserver" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "time"] }
